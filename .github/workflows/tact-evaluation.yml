# =========================
# TACT Evaluation Harness CI (Phase 22)
# =========================
#
# 目的: Phase 20で構築したtests/tact/(Evaluation Harness)を
# GitHub Actions上で自動実行し、Phase 1〜21で積み上げたCapability
# (Intent Routing / Ambiguity Detection / Decomposition /
# Failure Recovery / Aggregator / Episode / Model Router /
# TaskContext / Executor / Confidence Signal)が壊れていないことを、
# 人間が毎回手動でnpm testを実行しなくても検知できるようにする。
#
# 絶対条件: LLM call = 0 / Search API call = 0。tests/tact/配下は
# Phase 20〜21を通じて一貫してMock(core/tact-core/mockCoreCapability.ts)
# ・純粋関数・constructされたテストデータのみで検証する設計になって
# おり、実際に外部ネットワークへ到達するコードは含まない
# (Phase22 Step2で.envもAPI Keyの実値も無い状態で84件全PASSすることを
# 実測済み)。
#
# OPENAI_API_KEY / ANTHROPIC_API_KEYについて: 本物の資格情報ではない。
# core/llm/providers/openai.ts・claude.tsが、モジュール読み込み時点
# (importした瞬間、実際にAPIを呼ぶかどうかとは無関係)にSDKクライアント
# を構築しており、環境変数が存在しないだけでimportが例外を投げる
# (Phase22 Step1で実測確認)。tests/tact/配下の全Testはこれらの値を
# 実際に使って外部へ通信することはない(mock/pure functionのみ)ため、
# ここではダミー文字列を直接指定する(GitHub Secretsとしては登録しない
# ——絶対条件10: secrets/API key/.env/credentialをCIへ持ち込まない)。
#
# NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEYについて
# (SOR-122): 同じ理由・同じ絶対条件で追加する。本物の資格情報ではない。
# core/database/supabase.tsがモジュール読み込み時点でcreateClient()を
# 呼んでおり、環境変数が無いだけでimportが例外を投げる(SOR-122実測:
# tests/tact/runAll.tsがtests/tact/research/emptyStateGreeting.test.ts
# -> components/research/ResearchWorkspace.tsx ->
# components/auth/AuthProvider.tsx -> core/database/supabase.tsという
# 既存のimport連鎖経由でこれを間接的に読み込んでいる)。createClient()
# 自体は同期的にオブジェクトを構築するだけで、この時点ではネットワーク
# I/Oを一切発生させない。supabaseクライアントの実際のメソッド呼び出し
# (supabase.auth.*等)はAuthProvider内のReact hook本体にのみ存在し、
# tests/tact配下(Reactをrenderしないプレーンな Node scriptとして実行)
# ではこれらのhookが実行されないため、この値を実際のquery/authに使う
# Testは存在しない(SOR-122実測: .env削除状態でも2645件全PASS)。
# よってURLは構文的に妥当な文字列であればよく、実在のSupabase project
# である必要はない。

name: TACT Evaluation Harness

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  evaluate:
    runs-on: ubuntu-latest

    # ダミー値(実際のAPI呼び出しには一切使われない、上記コメント参照)。
    env:
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      ANTHROPIC_API_KEY: ci-placeholder-not-a-real-key
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # SOR-122: Node 20を使うと、NEXT_PUBLIC_SUPABASE_URL等の
          # placeholder値を設定してもなお別のimport-time例外が発生する
          # (SupabaseClientのコンストラクタがRealtimeClientを同期的に
          # 初期化しており、@supabase/realtime-jsのWebSocketFactoryが
          # `typeof globalThis.WebSocket !== "undefined"`のみを見て
          # 判定するため。Node 20にはグローバルWebSocketが無く
          # 「Node.js detected but native WebSocket not found. Ensure
          # you are running Node.js 22+」で例外を投げる——realtime-js
          # 自身のエラーメッセージが推奨する解決策)。ネットワークI/O
          # ではなくruntime capability検出の問題であり、認証情報とは
          # 無関係(SOR-122実測: ローカルNode 24では同じplaceholder値で
          # 問題なくPASSしていた)。元々のNode 20指定は
          # package.jsonのdevDependencies(@types/node: ^20)に合わせた
          # だけで、実行時Node versionを強制する根拠(.nvmrc/
          # engines等)は無い——型定義がやや古いだけで22との非互換は
          # 発生しない。
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TACT Evaluation Harness (npm test)
        run: npm test

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.json

      - name: ESLint (TACT scope only)
        # 絶対条件: 既存のnpm run lint(プロジェクト全体)は、TACTの
        # 変更範囲外であるLegacy側(core/workflow/*等)の既存any使用
        # (Phase22 Step1実測: 59 errors、TACT開発の既定方針として
        # 「今回の変更範囲外なら修正しない」対象)により恒常的に
        # failureになるため、CIへそのまま組み込まない。ここではTACT
        # (core/tact-*・core/llm・tests/tact)の範囲だけをlintする
        # (Phase22 Step2実測: 同じ範囲で0 errors)。npm run lint自体は
        # 変更していない(絶対条件11)。
        run: >
          npx eslint
          "core/tact-orchestrator/**/*.ts"
          "core/tact-intent/**/*.ts"
          "core/tact-research/**/*.ts"
          "core/tact-core/**/*.ts"
          "core/tact-design/**/*.ts"
          "core/llm/**/*.ts"
          "tests/tact/**/*.ts"
